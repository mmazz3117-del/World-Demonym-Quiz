let deck=[],currentIndex=0,score=0,streak=0,completed=false,current=null;const $=id=>document.getElementById(id),answerInput=$('answerInput'),feedback=$('feedback'),nextBtn=$('nextBtn');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]]}return a}function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/^(a|an|the)\s+/,'').replace(/\s+/g,' ').trim()}function correct(v){const n=normalize(v);return current.accepted.some(a=>normalize(a)===n)}function start(){deck=shuffle(DATA);currentIndex=0;score=0;streak=0;$('finishModal').classList.remove('show');load()}function load(){completed=false;current=deck[currentIndex];$('countryName').textContent=current.country;answerInput.value='';answerInput.disabled=false;$('checkBtn').disabled=false;$('showBtn').disabled=false;nextBtn.hidden=true;feedback.className='feedback';feedback.textContent='Type your answer, then tap Check Answer.';stats();setTimeout(()=>answerInput.focus(),120)}function lock(){completed=true;answerInput.disabled=true;$('checkBtn').disabled=true;$('showBtn').disabled=true;nextBtn.hidden=false;nextBtn.textContent=currentIndex===deck.length-1?'See final score':'Next country'}function check(){if(completed)return;const v=answerInput.value.trim();if(!v){feedback.className='feedback bad';feedback.textContent='Enter an answer first.';answerInput.focus();return}if(correct(v)){score++;streak++;feedback.className='feedback good';feedback.textContent=`Correct! People from ${current.country} are called ${current.answer}.`;lock()}else{streak=0;feedback.className='feedback bad';feedback.textContent='Not quite. Try again, or tap Show Answer.';answerInput.select()}stats()}function reveal(){if(completed)return;streak=0;feedback.className='feedback bad';feedback.textContent=`The answer is: ${current.answer}.`;lock();stats()}function next(){if(!completed)return;if(curr
