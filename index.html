<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>World Demonym Quiz</title>
<style>
:root{--bg:#f2f7f5;--card:#fff;--ink:#17312f;--muted:#647572;--accent:#0f766e;--line:#dce8e5;--good:#18784c;--bad:#b13b3b;--shadow:0 18px 44px rgba(27,63,58,.13)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(15,118,110,.14),transparent 34%),linear-gradient(#f9fbfa,var(--bg));color:var(--ink)}
.app{width:min(100%,540px);min-height:100vh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}h1{font-size:1.4rem;margin:0}.sub{margin:5px 0 0;color:var(--muted);font-size:.9rem}.globe{width:48px;height:48px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:1.65rem;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat strong{display:block;font-size:1.18rem}.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.track{height:8px;border-radius:99px;background:#dce8e5;overflow:hidden;margin:12px 0 14px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px 18px;display:flex;flex-direction:column}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;font-size:.76rem}.country{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.08;margin:12px 0 6px}.prompt{margin:0 0 18px;color:var(--muted)}
.choices{display:grid;gap:10px}.choice{appearance:none;width:100%;border:1.5px solid var(--line);border-radius:15px;padding:15px 14px;background:#fbfdfc;color:var(--ink);text-align:left;font-size:1rem;font-weight:750;min-height:54px}.choice:active{transform:scale(.985)}.choice.correct{background:#e8f6ee;border-color:#82c8a3;color:var(--good)}.choice.wrong{background:#fdecec;border-color:#e4a2a2;color:var(--bad)}.choice.dim{opacity:.55}
.feedback{min-height:46px;margin-top:14px;padding:12px 13px;border-radius:14px;background:#f4f8f7;color:var(--muted);font-weight:650;line-height:1.35}.feedback.good{background:#eaf7ef;color:var(--good)}.feedback.bad{background:#fff0f0;color:var(--bad)}
.next{margin-top:12px;width:100%;border:0;border-radius:15px;padding:15px;background:var(--accent);color:#fff;font-size:1rem;font-weight:800}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;margin-top:12px}.link{border:0;background:transparent;color:var(--accent);font-weight:800;padding:8px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(8,32,29,.56);align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-card{width:min(100%,420px);background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);text-align:center}.modal-card h2{margin-top:0}.modal-card p{color:var(--muted);line-height:1.5}.secondary{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:14px;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header><div><h1>World Demonym Quiz</h1><p class="sub">What are people from each country called?</p></div><div class="globe">🌍</div></header>
<section class="stats"><div class="stat"><strong id="score">0</strong><span>Score</span></div><div class="stat"><strong id="streak">0</strong><span>Streak</span></div><div class="stat"><strong id="count">1 / 195</strong><span>Question</span></div></section>
<div class="track"><div class="bar" id="bar"></div></div>
<main class="card"><div class="eyebrow">Choose the correct answer</div><h2 class="country" id="country">Loading…</h2><p class="prompt">People from this country are called:</p><div class="choices" id="choices"></div><div class="feedback" id="feedback">Tap an answer to begin.</div><button class="next" id="next" hidden>Next country</button></main>
<div class="footer"><span>No repeats until the full round ends.</span><button class="link" id="reset">Reset game</button></div>
</div>
<div class="modal" id="modal"><div class="modal-card"><h2>Round complete! 🎉</h2><p id="final"></p><button class="next" id="again">Play another round</button><button class="secondary" id="close">Review this screen</button></div></div>
<script>
const DATA = [{"country": "Afghanistan", "answer": "Afghan"}, {"country": "Albania", "answer": "Albanian"}, {"country": "Algeria", "answer": "Algerian"}, {"country": "Andorra", "answer": "Andorran"}, {"country": "Angola", "answer": "Angolan"}, {"country": "Antigua and Barbuda", "answer": "Antiguan and Barbudan"}, {"country": "Argentina", "answer": "Argentine or Argentinian"}, {"country": "Armenia", "answer": "Armenian"}, {"country": "Australia", "answer": "Australian"}, {"country": "Austria", "answer": "Austrian"}, {"country": "Azerbaijan", "answer": "Azerbaijani"}, {"country": "Bahamas", "answer": "Bahamian"}, {"country": "Bahrain", "answer": "Bahraini"}, {"country": "Bangladesh", "answer": "Bangladeshi"}, {"country": "Barbados", "answer": "Barbadian"}, {"country": "Belarus", "answer": "Belarusian"}, {"country": "Belgium", "answer": "Belgian"}, {"country": "Belize", "answer": "Belizean"}, {"country": "Benin", "answer": "Beninese"}, {"country": "Bhutan", "answer": "Bhutanese"}, {"country": "Bolivia", "answer": "Bolivian"}, {"country": "Bosnia and Herzegovina", "answer": "Bosnian and Herzegovinian"}, {"country": "Botswana", "answer": "Motswana / Batswana"}, {"country": "Brazil", "answer": "Brazilian"}, {"country": "Brunei", "answer": "Bruneian"}, {"country": "Bulgaria", "answer": "Bulgarian"}, {"country": "Burkina Faso", "answer": "Burkinabé"}, {"country": "Burundi", "answer": "Burundian"}, {"country": "Cabo Verde", "answer": "Cabo Verdean"}, {"country": "Cambodia", "answer": "Cambodian"}, {"country": "Cameroon", "answer": "Cameroonian"}, {"country": "Canada", "answer": "Canadian"}, {"country": "Central African Republic", "answer": "Central African"}, {"country": "Chad", "answer": "Chadian"}, {"country": "Chile", "answer": "Chilean"}, {"country": "China", "answer": "Chinese"}, {"country": "Colombia", "answer": "Colombian"}, {"country": "Comoros", "answer": "Comorian"}, {"country": "Democratic Republic of the Congo", "answer": "Congolese"}, {"country": "Republic of the Congo", "answer": "Congolese"}, {"country": "Costa Rica", "answer": "Costa Rican"}, {"country": "Côte d’Ivoire", "answer": "Ivorian"}, {"country": "Croatia", "answer": "Croatian"}, {"country": "Cuba", "answer": "Cuban"}, {"country": "Cyprus", "answer": "Cypriot"}, {"country": "Czechia", "answer": "Czech"}, {"country": "Denmark", "answer": "Danish / a Dane"}, {"country": "Djibouti", "answer": "Djiboutian"}, {"country": "Dominica", "answer": "Dominican"}, {"country": "Dominican Republic", "answer": "Dominican"}, {"country": "Ecuador", "answer": "Ecuadorian"}, {"country": "Egypt", "answer": "Egyptian"}, {"country": "El Salvador", "answer": "Salvadoran"}, {"country": "Equatorial Guinea", "answer": "Equatorial Guinean"}, {"country": "Eritrea", "answer": "Eritrean"}, {"country": "Estonia", "answer": "Estonian"}, {"country": "Eswatini", "answer": "Swazi"}, {"country": "Ethiopia", "answer": "Ethiopian"}, {"country": "Fiji", "answer": "Fijian"}, {"country": "Finland", "answer": "Finnish / a Finn"}, {"country": "France", "answer": "French"}, {"country": "Gabon", "answer": "Gabonese"}, {"country": "Gambia", "answer": "Gambian"}, {"country": "Georgia", "answer": "Georgian"}, {"country": "Germany", "answer": "German"}, {"country": "Ghana", "answer": "Ghanaian"}, {"country": "Greece", "answer": "Greek"}, {"country": "Grenada", "answer": "Grenadian"}, {"country": "Guatemala", "answer": "Guatemalan"}, {"country": "Guinea", "answer": "Guinean"}, {"country": "Guinea-Bissau", "answer": "Bissau-Guinean"}, {"country": "Guyana", "answer": "Guyanese"}, {"country": "Haiti", "answer": "Haitian"}, {"country": "Honduras", "answer": "Honduran"}, {"country": "Hungary", "answer": "Hungarian"}, {"country": "Iceland", "answer": "Icelandic / an Icelander"}, {"country": "India", "answer": "Indian"}, {"country": "Indonesia", "answer": "Indonesian"}, {"country": "Iran", "answer": "Iranian"}, {"country": "Iraq", "answer": "Iraqi"}, {"country": "Ireland", "answer": "Irish"}, {"country": "Israel", "answer": "Israeli"}, {"country": "Italy", "answer": "Italian"}, {"country": "Jamaica", "answer": "Jamaican"}, {"country": "Japan", "answer": "Japanese"}, {"country": "Jordan", "answer": "Jordanian"}, {"country": "Kazakhstan", "answer": "Kazakhstani"}, {"country": "Kenya", "answer": "Kenyan"}, {"country": "Kiribati", "answer": "I-Kiribati"}, {"country": "Kuwait", "answer": "Kuwaiti"}, {"country": "Kyrgyzstan", "answer": "Kyrgyz / Kyrgyzstani"}, {"country": "Laos", "answer": "Lao / Laotian"}, {"country": "Latvia", "answer": "Latvian"}, {"country": "Lebanon", "answer": "Lebanese"}, {"country": "Lesotho", "answer": "Mosotho / Basotho"}, {"country": "Liberia", "answer": "Liberian"}, {"country": "Libya", "answer": "Libyan"}, {"country": "Liechtenstein", "answer": "Liechtensteiner"}, {"country": "Lithuania", "answer": "Lithuanian"}, {"country": "Luxembourg", "answer": "Luxembourger"}, {"country": "Madagascar", "answer": "Malagasy"}, {"country": "Malawi", "answer": "Malawian"}, {"country": "Malaysia", "answer": "Malaysian"}, {"country": "Maldives", "answer": "Maldivian"}, {"country": "Mali", "answer": "Malian"}, {"country": "Malta", "answer": "Maltese"}, {"country": "Marshall Islands", "answer": "Marshallese"}, {"country": "Mauritania", "answer": "Mauritanian"}, {"country": "Mauritius", "answer": "Mauritian"}, {"country": "Mexico", "answer": "Mexican"}, {"country": "Micronesia", "answer": "Micronesian"}, {"country": "Moldova", "answer": "Moldovan"}, {"country": "Monaco", "answer": "Monegasque"}, {"country": "Mongolia", "answer": "Mongolian"}, {"country": "Montenegro", "answer": "Montenegrin"}, {"country": "Morocco", "answer": "Moroccan"}, {"country": "Mozambique", "answer": "Mozambican"}, {"country": "Myanmar", "answer": "Burmese"}, {"country": "Namibia", "answer": "Namibian"}, {"country": "Nauru", "answer": "Nauruan"}, {"country": "Nepal", "answer": "Nepali / Nepalese"}, {"country": "Netherlands", "answer": "Dutch"}, {"country": "New Zealand", "answer": "New Zealander"}, {"country": "Nicaragua", "answer": "Nicaraguan"}, {"country": "Niger", "answer": "Nigerien"}, {"country": "Nigeria", "answer": "Nigerian"}, {"country": "North Korea", "answer": "North Korean"}, {"country": "North Macedonia", "answer": "Macedonian"}, {"country": "Norway", "answer": "Norwegian"}, {"country": "Oman", "answer": "Omani"}, {"country": "Pakistan", "answer": "Pakistani"}, {"country": "Palau", "answer": "Palauan"}, {"country": "Palestine", "answer": "Palestinian"}, {"country": "Panama", "answer": "Panamanian"}, {"country": "Papua New Guinea", "answer": "Papua New Guinean"}, {"country": "Paraguay", "answer": "Paraguayan"}, {"country": "Peru", "answer": "Peruvian"}, {"country": "Philippines", "answer": "Filipino / Filipina"}, {"country": "Poland", "answer": "Polish / a Pole"}, {"country": "Portugal", "answer": "Portuguese"}, {"country": "Qatar", "answer": "Qatari"}, {"country": "Romania", "answer": "Romanian"}, {"country": "Russia", "answer": "Russian"}, {"country": "Rwanda", "answer": "Rwandan"}, {"country": "Saint Kitts and Nevis", "answer": "Kittitian and Nevisian"}, {"country": "Saint Lucia", "answer": "Saint Lucian"}, {"country": "Saint Vincent and the Grenadines", "answer": "Vincentian"}, {"country": "Samoa", "answer": "Samoan"}, {"country": "San Marino", "answer": "Sammarinese"}, {"country": "São Tomé and Príncipe", "answer": "São Toméan"}, {"country": "Saudi Arabia", "answer": "Saudi / Saudi Arabian"}, {"country": "Senegal", "answer": "Senegalese"}, {"country": "Serbia", "answer": "Serbian"}, {"country": "Seychelles", "answer": "Seychellois"}, {"country": "Sierra Leone", "answer": "Sierra Leonean"}, {"country": "Singapore", "answer": "Singaporean"}, {"country": "Slovakia", "answer": "Slovak"}, {"country": "Slovenia", "answer": "Slovenian"}, {"country": "Solomon Islands", "answer": "Solomon Islander"}, {"country": "Somalia", "answer": "Somali"}, {"country": "South Africa", "answer": "South African"}, {"country": "South Korea", "answer": "South Korean"}, {"country": "South Sudan", "answer": "South Sudanese"}, {"country": "Spain", "answer": "Spanish / a Spaniard"}, {"country": "Sri Lanka", "answer": "Sri Lankan"}, {"country": "Sudan", "answer": "Sudanese"}, {"country": "Suriname", "answer": "Surinamese"}, {"country": "Sweden", "answer": "Swedish / a Swede"}, {"country": "Switzerland", "answer": "Swiss"}, {"country": "Syria", "answer": "Syrian"}, {"country": "Tajikistan", "answer": "Tajik / Tajikistani"}, {"country": "Tanzania", "answer": "Tanzanian"}, {"country": "Thailand", "answer": "Thai"}, {"country": "Timor-Leste", "answer": "Timorese"}, {"country": "Togo", "answer": "Togolese"}, {"country": "Tonga", "answer": "Tongan"}, {"country": "Trinidad and Tobago", "answer": "Trinidadian and Tobagonian"}, {"country": "Tunisia", "answer": "Tunisian"}, {"country": "Türkiye", "answer": "Turkish / a Turk"}, {"country": "Turkmenistan", "answer": "Turkmen / Turkmenistani"}, {"country": "Tuvalu", "answer": "Tuvaluan"}, {"country": "Uganda", "answer": "Ugandan"}, {"country": "Ukraine", "answer": "Ukrainian"}, {"country": "United Arab Emirates", "answer": "Emirati"}, {"country": "United Kingdom", "answer": "British / a Briton"}, {"country": "United States", "answer": "American"}, {"country": "Uruguay", "answer": "Uruguayan"}, {"country": "Uzbekistan", "answer": "Uzbek / Uzbekistani"}, {"country": "Vanuatu", "answer": "Ni-Vanuatu"}, {"country": "Vatican City", "answer": "Vatican citizen"}, {"country": "Venezuela", "answer": "Venezuelan"}, {"country": "Vietnam", "answer": "Vietnamese"}, {"country": "Yemen", "answer": "Yemeni"}, {"country": "Zambia", "answer": "Zambian"}, {"country": "Zimbabwe", "answer": "Zimbabwean"}];
let deck=[],index=0,score=0,streak=0,answered=false,current;
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wrongs(correct){const seen=new Set([correct]),out=[];for(const a of shuffle(DATA.map(x=>x.answer))){if(!seen.has(a)){seen.add(a);out.push(a)}if(out.length===3)break}return out}
function stats(){$('score').textContent=score;$('streak').textContent=streak;$('count').textContent=`${index+1} / ${deck.length||DATA.length}`;const done=answered?index+1:index;$('bar').style.width=`${done/DATA.length*100}%`}
function load(){answered=false;current=deck[index];$('country').textContent=current.country;$('choices').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='Tap the answer you think is correct.';$('next').hidden=true;for(const option of shuffle([current.answer,...wrongs(current.answer)])){const b=document.createElement('button');b.className='choice';b.textContent=option;b.onclick=()=>choose(b,option);$('choices').appendChild(b)}stats()}
function choose(button,selected){if(answered)return;answered=true;const ok=selected===current.answer;for(const b of $('choices').children){b.disabled=true;if(b.textContent===current.answer)b.classList.add('correct');else if(b===button&&!ok)b.classList.add('wrong');else b.classList.add('dim')}if(ok){score++;streak++;$('feedback').className='feedback good';$('feedback').textContent=`Correct! People from ${current.country} are called ${current.answer}.`}else{streak=0;$('feedback').className='feedback bad';$('feedback').textContent=`Not quite. People from ${current.country} are called ${current.answer}.`}$('next').textContent=index===deck.length-1?'See final score':'Next country';$('next').hidden=false;stats()}
function next(){if(!answered)return;if(index===deck.length-1){const pct=Math.round(score/deck.length*100);$('final').textContent=`You scored ${score} out of ${deck.length} (${pct}%).`;$('modal').classList.add('show')}else{index++;load()}}
function start(){deck=shuffle(DATA);index=score=streak=0;$('modal').classList.remove('show');load()}
$('next').onclick=next;$('reset').onclick=start;$('again').onclick=start;$('close').onclick=()=>$('modal').classList.remove('show');start();
</script>
